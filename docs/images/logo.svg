<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="tjTitle tjDesc">
  <title id="tjTitle">天机智能体</title>
  <desc id="tjDesc">天机罗盘：外环为观测视野，中心四芒星为洞察，环上三个节点代表汇聚的多个数据源。</desc>

  <defs>
    <linearGradient id="tjGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="55%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="tjStar" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
  </defs>

  <!-- 外环：观测视野 -->
  <circle cx="64" cy="64" r="56" fill="none" stroke="url(#tjGrad)" stroke-width="4"/>

  <!-- 内环刻度：数据的度量 -->
  <circle cx="64" cy="64" r="44" fill="none" stroke="url(#tjGrad)" stroke-width="1.6"
          stroke-dasharray="2 6" stroke-linecap="round" opacity="0.45"/>

  <!-- 中心四芒星：一句话问出的洞察 -->
  <path fill="url(#tjStar)"
        d="M64 32 C66 52 76 62 96 64 C76 66 66 76 64 96 C62 76 52 66 32 64 C52 62 62 52 64 32 Z"/>

  <!-- 环上三节点：接进来的数据源 -->
  <circle cx="64"   cy="8"  r="6.5" fill="#F59E0B"/>
  <circle cx="15.5" cy="92" r="6.5" fill="#F59E0B"/>
  <circle cx="112.5" cy="92" r="6.5" fill="#F59E0B"/>
</svg>
