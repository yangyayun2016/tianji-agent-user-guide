name: 部署文档站到 GitHub Pages

on:
  # 推送到 main 分支时自动发布
  push:
    branches: [main]
  # 也可以在 Actions 页面手动触发
  workflow_dispatch:

# GITHUB_TOKEN 权限：读代码、写 Pages、签发部署身份
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个发布；不取消进行中的部署，避免线上站点处于半更新状态
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 构建
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # VitePress 的「最后更新时间」取自 git 提交记录，需要完整历史
          fetch-depth: 0

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 安装依赖
        run: npm ci

      - name: 构建站点
        run: npm run docs:build

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          # 与 docs/.vitepress/config.mts 里的 outDir 保持一致
          path: dist

  deploy:
    name: 发布
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
